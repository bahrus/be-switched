<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <div>
        <template id=template be-switched='{
            "lhs": 37,
            "rhs": "hello"
        }
        '
        >
            <div id=equals>LHS === RHS</div>
        </template>
    </div>

    <button id=button onclick=setLHS()>Set lhs = "hello"</button>
    <div id=target></div>
    <script>
        function setLHS(){
            template.beEnhanced.beSwitched.lhs = 'hello';
        }
    </script>
    <script>
        function runTest(){
            button.click();
            setTimeout(() => {
                if(window['equals'] !== undefined){
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }
        setTimeout(() => {
            runTest();
        }, 4000);
    </script>
</body>
</html>
