<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example !2a</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>

<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <div>
        <label for=lhs>LHS:</label>
        <input value=a id=lhs>
    </div>
    <div>
        <label for=rhs>RHS:</label>
        <input id=rhs>
    </div>

    <template 🎚️='off when #lhs = #rhs'>
        <div id=not_equals>LHS !== RHS</div>
    </template>

    <div id=target></div>
    <script>
        function runTest() {
            setTimeout(() => {
                if (window['not_equals'] !== undefined) {
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }
        setTimeout(() => {
            runTest();
        }, 2000);
    </script>
</body>

</html>
