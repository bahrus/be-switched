<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 4b</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <mood-stone id=moodStone></mood-stone>
    <div id=target></div>
    <script type=module>
        import '/sample/MoodStone.js';
    </script>
    <script>
        function runTest() {
            moodStone.isHappy = true;
            setTimeout(() => {
                if(moodStone.shadowRoot.querySelector('#eq') !== null){
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }
        setTimeout(() => {
            runTest();
        }, 1000);
    </script>
</body>
</html>
