<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 4b</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <mood-stone id=moodStone></mood-stone>
    <div id=target></div>
    <script type=module>
        import '/🎚️.js';
        import '/sample/MoodStone.js';
    </script>
    <script>
        function runTest() {
            moodStone.isHappy = true;
            setTimeout(() => {
                if(moodStone.shadowRoot.querySelector('#eq') !== null){
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }
        setTimeout(() => {
            runTest();
        }, 1000);
    </script>
</body>
</html>
