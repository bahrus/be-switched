<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <form>
        <input part=isHappy type="checkbox">
        <template be-switched='on only when %isHappy.'>
            <my-content id=myContent></my-content>
        </template>
    </form>
    <div id=target></div>
    <script type=module>
        import '../emc.js';
    </script>
    <script>
        function runTest() {
            document.querySelector('input').click();
            setTimeout(() => {
                if (window['myContent'] !== undefined) {
                    target.setAttribute('mark', 'good');
                }
            }, 100);
        }
        setTimeout(() => {
            runTest();
        }, 2000);
    </script>
</body>
</html>
