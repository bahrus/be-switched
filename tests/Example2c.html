<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <div itemscope>
        <span itemprop=lhs contenteditable>I am here</span>
    
        <span itemprop=rhs contenteditable>I am here</span>
        
        
        <template be-switched='on when |lhs equals |rhs.'>
            <div id=equals>LHS === RHS</div>
        </template>
    </div>

    <div id=target></div>

    <script type=module>
        import '../emc.js';
    </script>
        <script>
            function runTest() {
                setTimeout(() => {
                    if (window['equals'] !== undefined) {
                        target.setAttribute('mark', 'good');
                    }
                }, 100);
            }
            setTimeout(() => {
                runTest();
            }, 2000);
        </script>
</body>
</html>
