<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boolish conditions => by name</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <form>
        <input name=isHappy type="checkbox" @>
        <template -id defer-🎚️ 🎚️='on when #{{isHappy}}'>
            <my-content></my-content>
        </template>
    </form>
</body>
</html>
