    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>boolish conditions => by name => default input event</title>

<body>
    <form>
        <input name=isHappy type="checkbox">
        <template 🎚️='on when @isHappy.'>
            <my-content></my-content>
        </template>
    </form>
    <script type=module>
        import '/🎚️.js';
    </script>
</body>
