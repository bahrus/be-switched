<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>closest section lhs name eq closest section rhs name</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    These should be ignored:
    <div>
        <label for=lhs>LHS:</label>
        <input name=lhs>
        <label for=rhs>RHS:</label>
        <input name=rhs>
    </div>
    These should be active:
    <section>
        <label for=lhs>LHS:</label>
        <input name=lhs>
        <label for=rhs>RHS:</label>
        <input name=rhs>
        <template 🎚️='on when ^{section}@lhs equals ^{section}@rhs.'>
            <div>LHS === RHS</div>
        </template>
    </section>



    <script type=module>
        import '/🎚️.js';
    </script>
</body>
</html>
