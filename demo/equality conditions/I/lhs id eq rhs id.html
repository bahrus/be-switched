<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lhs id equals rhs id</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <label >
        LHS: <input id=lhs>
    </label>
    
    <label for=rhs>
        RHS: <input id=rhs>
    </label>
    
    <template 🎚️='on when #lhs eq #rhs.'>
        <div>LHS === RHS</div>
    </template>


    <script type=module>
        import '/🎚️.js';
    </script>
</body>
</html>
