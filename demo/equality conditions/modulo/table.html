<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>equality conditions > modulo > table</title>
    <script type=importmap>
        {
            "imports": {
                "be-enhanced/": "/node_modules/be-enhanced/",
                "be-hive/":  "/node_modules/be-hive/",
                "be-linked/": "/node_modules/be-linked/",
                "be-propagating/": "/node_modules/be-propagating/",
                "be-value-added/": "/node_modules/be-value-added/",
                "mount-observer/": "/node_modules/mount-observer/",
                "trans-render/": "/node_modules/trans-render/"
            }
        }
    </script>
</head>
<body>
    <table>
        <tbody>
            <tr aria-rowindex=10><td><input name=lhs></td></tr>
            <tr aria-rowindex=10>
                <td>
                    <template 🎚️="on when @lhs eq @rhs w/i %[aria-rowindex].">
                        <div>lhs == rhs</div>
                    </template>
                </td>
            </tr>
            <tr aria-rowindex=10><td><input name=rhs></td></tr>
            <tr aria-rowindex=11><td><input name=lhs></td></tr>
            <tr aria-rowindex=11>
                <td>
                    <template 🎚️="on when @lhs eq @rhs w/i %[aria-rowindex].">
                        <div>lhs == rhs</div>
                    </template>
                </td>
            </tr>
            <tr aria-rowindex=11><td><input name=rhs></td></tr>
        </tbody>
    </table>



    <script type=module>
        import '/🎚️.js';
    </script>
</body>
</html>
