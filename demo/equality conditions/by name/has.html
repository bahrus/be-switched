<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lhs name eq rhs name</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <form>
        <label for=lhs>LHS:</label>
        <input name=lhs>
        <label for=rhs>RHS:</label>
        <input name=rhs>
        <template 🎚️='on when @lhs eq @rhs.'></template>
        <div>LHS === RHS</div>
    </form>

    <style>
        form:has(template.be-switched-off) div{
            display: none;
        }
    </style>

    <script type=module>
        import '/🎚️.js';
    </script>
</body>
</html>
