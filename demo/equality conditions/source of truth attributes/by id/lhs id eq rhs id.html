<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lhs id equals rhs id</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <label title="LHS value" for=lhs>LHS:</label>
    <input id=lhs>
    <label title="RHS value" for=rhs>RHS:</label>
    <input id=rhs>
    <template 🎚️='on when #lhs@title eq #rhs@title'>
        <div>LHS === RHS</div>
    </template>
</body>
</html>
