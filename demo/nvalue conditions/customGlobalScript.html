<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on input</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <script type=module>
        import {register} from '/emc.js';
        register('isEqual', e => e.r = e.f.lhs === e.f.rhs)
    </script>
    <my-host-element itemscope>
        <label for=lhs>LHS:</label>
        <input id=lhs>
        <label for=rhs>RHS:</label>
        <input id=rhs>
        <template be-switched='on if isEqual, based on #lhs and #rhs.'>
            <div>LHS === RHS</div>
        </template>
    </my-host-element>



    <script type=module>
        import '/emc.js';
    </script>
</body>
</html>
