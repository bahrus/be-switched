<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on input</title>
    <script type=importmap>
        {
            "imports": {
                "be-enhanced/": "/node_modules/be-enhanced/",
                "be-hive/":  "/node_modules/be-hive/",
                "mount-observer/": "/node_modules/mount-observer/",
                "trans-render/": "/node_modules/trans-render/"
            }
        }
    </script>
</head>
<body>
    <script type=module>
        import {register} from '/behivior.js';
        register('isEqual', e => e.r = e.f.lhs === e.f.rhs)
    </script>
    <my-host-element itemscope>
        <label for=lhs>LHS:</label>
        <input id=lhs>
        <label for=rhs>RHS:</label>
        <input id=rhs>
        <template be-switched='on if isEqual, based on #lhs and #rhs.'>
            <div>LHS === RHS</div>
        </template>
    </my-host-element>



    <script type=module>
        import '/behivior.js';
    </script>
</body>
</html>
