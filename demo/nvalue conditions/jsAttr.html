<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on input</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <fieldset disabled>
        <label>
            LHS: <input id={{lhs}}>
        </label>
        
        <label>
            RHS: <input id={{rhs}}>
        </label>
        
        <template 🤪 
            defer-🎚️
            be-switched="on based on #{{lhs}} and #{{rhs}}."
            be-switched-js='f.lhs.length === f.rhs.length'
            >
            <div>LHS.length === RHS.length</div>
        </template>
    </fieldset>
 


    <script type=module>
        import '/emc.js';
        import 'be-giddy/🤪.js'
    </script>
</body>
</html>
