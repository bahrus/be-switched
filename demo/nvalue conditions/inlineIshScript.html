<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on input</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <label>
        LHS: <input data-id={{lhs}}>
    </label>
    
    <label>
        RHS: <input data-id={{rhs}}>
    </label>
    
    <template 🤪 
        onchange="event.r = event.f.lhs.length === event.f.rhs.length"
        defer-🎚️
        🎚️='on based on #{{lhs}} and #{{rhs}}.'>
        <div>LHS.length === RHS.length</div>
    </template>


    <script type=module>
        import '/🎚️.js';
        import 'be-giddy/🤪.js';
    </script>
</body>
</html>
