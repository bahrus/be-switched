<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>on input</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <label>
        LHS: <input data-id={{lhs}}>
    </label>
    
    <label>
        RHS: <input data-id={{rhs}}>
    </label>
    
    <template -id 
        onchange="event.r = event.f.lhs.length === event.f.rhs.length"
        defer-🎚️
        🎚️='on based on #{{lhs}} and #{{rhs}}'>
        <div>LHS.length === RHS.length</div>
    </template>
</body>
</html>
