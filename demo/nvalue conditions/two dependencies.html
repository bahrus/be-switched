<body>
    <label for=lhs>LHS:</label>
    <input id=lhs>
    <label for=rhs>RHS:</label>
    <input id=rhs>

        be-switched='on if eq, based on #lhs and #rhs.'>
        <div>LHS === RHS</div>
    </template>

        import '/emc.js';
    </script>
</body>
