<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type=importmap>
        {
            "imports": {
                "be-enhanced/": "../node_modules/be-enhanced/",
                "be-linked/": "../be-linked/",
                "be-hive/":  "../node_modules/be-hive/",
                "trans-render/": "../node_modules/trans-render/",
                "xtal-element/": "../node_modules/xtal-element/"
            }
        }
    </script>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <label for=lhs>LHS:</label>
    <input id=lhs>
    <label for=rhs>RHS:</label>
    <input id=rhs>
    <template be-linked='
        On input event of previous lhs id pass value property to $0-enh-by-be-switched => lhs.
        ^  ^     ^     ^  ^        rhs ^  ^    ^     ^        ^  ^                     => rhs.
    '
    >
        <div>LHS === RHS</div>
    </template>

    <script type=module>
        import 'be-linked/be-linked.js';
    </script>
</body>
</html>
