<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lhs id gt rhs id</title>
    <script type=importmap>
        {
            "imports": {
                "be-enhanced/": "/node_modules/be-enhanced/",
                "be-hive/":  "/node_modules/be-hive/",
                "be-linked/": "/node_modules/be-linked/",
                "be-propagating/": "/node_modules/be-propagating/",
                "be-value-added/": "/node_modules/be-value-added/",
                "mount-observer/": "/node_modules/mount-observer/",
                "trans-render/": "/node_modules/trans-render/",
                "xtal-element/": "/node_modules/xtal-element/"
            }
        }
    </script>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <be-hive>
        <script type=emc-parser
                src="be-hive/parsers/parse-pattern-statements.js"
                parser-name=parse-pattern-statements></script>
        <script type=emc
                src="be-switched/🎚️.json"
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <label for=lhs>LHS:</label>
    <input type=number id=lhs>
    <label for=rhs>RHS:</label>
    <input type=number id=rhs>
    <template 🎚️='on when #lhs gt #rhs'>
        <div>LHS &gt; RHS</div>
    </template>
</body>
</html>
